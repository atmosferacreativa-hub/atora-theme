name: Atora Meridian CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atora-theme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          find . -path ./.git -prune -o -name '*.php' -print0 |
            xargs -0 -n1 php -l

  static-checks:
    name: Version and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: "Check version: style.css vs ATORA_THEME_VERSION"
        shell: bash
        run: bash scripts/check-version.sh

      - name: "Validate tel: and WhatsApp links"
        shell: bash
        run: bash scripts/validate-links.sh

      - name: "Traducciones completas (12 idiomas)"
        shell: bash
        run: CI=1 python3 scripts/check-translations.py

  distribution-zip:
    name: Distribution ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Build ZIP
        shell: bash
        run: bash scripts/build-dist.sh HEAD

      - name: Inspect ZIP
        shell: bash
        run: |
          zip_path="$(ls dist/atora-meridian-*.zip)"
          listing="$(unzip -Z1 "$zip_path")"
          failures=0
          for required in style.css functions.php theme.json screenshot.png; do
            if ! grep -qx "atora-theme/${required}" <<< "$listing"; then
              echo "Falta atora-theme/${required}" >&2; failures=$((failures + 1))
            fi
          done
          if grep -qvE '^atora-theme/' <<< "$listing"; then
            echo "Hay entradas fuera de la carpeta raíz atora-theme/" >&2; failures=$((failures + 1))
          fi
          for forbidden in .github scripts .git dist; do
            if grep -qE "^atora-theme/${forbidden}/" <<< "$listing"; then
              echo "No debe incluir ${forbidden}/" >&2; failures=$((failures + 1))
            fi
          done
          for forbidden in README.md CHANGELOG.md .distignore .gitignore; do
            if grep -qx "atora-theme/${forbidden}" <<< "$listing"; then
              echo "No debe incluir ${forbidden}" >&2; failures=$((failures + 1))
            fi
          done
          echo "$zip_path: $(wc -l <<< "$listing") entradas"
          exit $failures

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.4"
          - "6.8"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          wp core download --version="${{ matrix.wordpress }}" --skip-content --path=/tmp/wordpress
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_DISPLAY false --raw --path=/tmp/wordpress
          wp core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title="Atora Meridian CI" --admin_user=admin --admin_password=atora-theme-ci-password --admin_email=ci@example.test --skip-email
          wp rewrite structure '/%postname%/' --path=/tmp/wordpress

      - name: Install and activate Atora Meridian
        shell: bash
        run: |
          mkdir -p /tmp/wordpress/wp-content/themes/atora-theme
          rsync -a --exclude=.git --exclude=.github --exclude=dist ./ /tmp/wordpress/wp-content/themes/atora-theme/
          wp theme activate atora-theme --path=/tmp/wordpress
          wp eval '
            $theme = wp_get_theme();
            if ( "Atora Meridian" !== $theme->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme: " . $theme->get( "Name" ) . "\n" );
              exit( 1 );
            }
          ' --path=/tmp/wordpress
          wp post create --post_type=page --post_status=publish --post_title="Pagina CI" --path=/tmp/wordpress
          wp post create --post_type=post --post_status=publish --post_title="Entrada CI" --path=/tmp/wordpress

      - name: Course progress has a single path
        shell: bash
        run: |
          wp eval-file scripts/check-progress.php --path=/tmp/wordpress
          ATORA_PROGRESS_STUB=1 wp eval-file scripts/check-progress.php --path=/tmp/wordpress

      - name: Render front-end pages
        shell: bash
        run: |
          wp server --host=127.0.0.1 --port=8080 --path=/tmp/wordpress > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          failures=0
          for path in / /pagina-ci/ /entrada-ci/ "/?s=ci" /no-existe/; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080${path}")
            expected=200
            [[ "$path" == /no-existe/ ]] && expected=404
            if [[ "$code" != "$expected" ]] || grep -qiE 'Fatal error|Parse error|critical error' /tmp/page.html; then
              echo "FAIL ${path}: HTTP ${code} (esperado ${expected})" >&2
              failures=$((failures + 1))
            else
              echo "OK ${path}: HTTP ${code}"
            fi
          done
          if [[ -f /tmp/wordpress/wp-content/debug.log ]] && grep -E 'PHP (Fatal|Parse|Warning)' /tmp/wordpress/wp-content/debug.log | grep -q 'themes/atora-theme'; then
            echo "Errores PHP del tema en debug.log" >&2
            failures=$((failures + 1))
          fi
          exit $failures

      - name: Surface WordPress debug log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            sed -n '1,400p' /tmp/wordpress/wp-content/debug.log
          fi

  atora-lms-integration:
    name: ATORA LMS (main) + contrato de la app
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: wp-cli
          extensions: mbstring, dom, gd, zip

      - name: Install WordPress, ATORA LMS and test data
        shell: bash
        run: |
          WP=/tmp/wordpress
          wp core download --version=6.8 --skip-content --path=$WP
          wp config create --path=$WP --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=$WP
          wp config set WP_DEBUG_LOG true --raw --path=$WP
          wp config set WP_DEBUG_DISPLAY false --raw --path=$WP
          wp config set WP_ENVIRONMENT_TYPE development --path=$WP
          # La API móvil exige HTTPS salvo en modo desarrollo.
          wp config set ATORA_DEV_MODE true --raw --path=$WP
          wp core install --path=$WP --url=http://127.0.0.1:8080 --title="Academia CI" --admin_user=admin --admin_password=atora-theme-ci-password --admin_email=ci@example.test --skip-email
          wp rewrite structure '/%postname%/' --path=$WP
          git clone --depth 1 https://github.com/atmosferacreativa-hub/Atora-LMS-6 $WP/wp-content/plugins/atora-lms
          wp plugin activate atora-lms --path=$WP
          mkdir -p $WP/wp-content/themes/atora-theme $WP/wp-content/themes/baseline
          rsync -a --exclude=.git --exclude=.github --exclude=dist ./ $WP/wp-content/themes/atora-theme/
          printf '/*\nTheme Name: Baseline CI\n*/\n' > $WP/wp-content/themes/baseline/style.css
          printf '<?php\nget_header(); while ( have_posts() ) { the_post(); the_content(); } get_footer();\n' > $WP/wp-content/themes/baseline/index.php
          wp atora seed-e2e --yes --path=$WP > /tmp/seed.json
          for u in estudiante_e2e docente_e2e; do
            id=$(wp user get $u --field=ID --path=$WP)
            for kv in first_name=Ana last_name=Prueba atora_whatsapp=+584125550000 atora_country_code=VE atora_state=Capital atora_city=Caracas; do
              wp user meta update $id "${kv%%=*}" "${kv#*=}" --path=$WP --quiet
            done
          done
          wp post create --post_type=page --post_status=publish --post_title="Panel" --post_name=panel-estudiante --post_content='[clms_dashboard]' --path=$WP
          wp post create --post_type=page --post_status=publish --post_title="Panel docente" --post_name=panel-docente --post_content='[clms_teacher_dashboard]' --path=$WP
          wp rewrite flush --path=$WP
          wp server --host=127.0.0.1 --port=8080 --path=$WP > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done

      - name: "Contrato de la app: la API móvil es idéntica con y sin el tema"
        shell: bash
        run: |
          WP=/tmp/wordpress
          wp theme activate baseline --path=$WP
          python3 scripts/check-mobile-contract.py snapshot http://127.0.0.1:8080 estudiante_e2e atora-e2e-2026 /tmp/contract-baseline.json
          wp theme activate atora-theme --path=$WP
          python3 scripts/check-mobile-contract.py snapshot http://127.0.0.1:8080 estudiante_e2e atora-e2e-2026 /tmp/contract-theme.json
          python3 scripts/check-mobile-contract.py compare /tmp/contract-baseline.json /tmp/contract-theme.json

      - name: "Plantilla de traducción al día (.pot)"
        shell: bash
        run: |
          wp i18n make-pot . /tmp/fresh.pot --domain=atora-learning --exclude=scripts,dist,languages --skip-js --skip-theme-json --skip-block-json
          python3 - <<'PY'
          import re
          def ids(path):
              text = open(path, encoding="utf-8").read()
              return set(m for m in re.findall(r'^msgid "(.*)"$', text, re.M) if m)
          fresh, repo = ids("/tmp/fresh.pot"), ids("languages/atora-learning.pot")
          if fresh != repo:
              print("Cadenas nuevas sin plantilla:", sorted(fresh - repo)[:20])
              print("Cadenas que ya no existen:", sorted(repo - fresh)[:20])
              raise SystemExit("Regenera languages/atora-learning.pot y traduce los .po")
          print("Plantilla al día:", len(repo), "cadenas")
          PY

      - name: Páginas de la academia con el tema
        shell: bash
        run: |
          WP=/tmp/wordpress
          wp theme activate atora-theme --path=$WP
          wp eval-file scripts/check-progress.php --path=$WP
          bash scripts/check-academy-pages.sh "$WP" http://127.0.0.1:8080

      - name: Set up Node for UI regression tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mobile and desktop browser regressions
        shell: bash
        run: |
          npm install --prefix /tmp/atora-browser playwright@1.58.2
          /tmp/atora-browser/node_modules/.bin/playwright install --with-deps chromium
          export ATORA_PLAYWRIGHT_MODULE=/tmp/atora-browser/node_modules/playwright
          export ATORA_STUDENT_COOKIE="$(SHOT_USER=estudiante_e2e wp eval-file scripts/auth-cookie.php --path=/tmp/wordpress)"
          export ATORA_TEACHER_COOKIE="$(SHOT_USER=docente_e2e wp eval-file scripts/auth-cookie.php --path=/tmp/wordpress)"
          node scripts/check-ui.cjs

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atora-responsive-ui
          path: /tmp/atora-ui/
          if-no-files-found: ignore

      - name: Surface WordPress debug log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            sed -n '1,400p' /tmp/wordpress/wp-content/debug.log
          fi
