name: ATORA Theme CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atora-theme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          find . -name '*.php' -print0 |
            xargs -0 -n1 php -l

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.4"
          - "6.8"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          wp core download --version="${{ matrix.wordpress }}" --skip-content --path=/tmp/wordpress
          wp config create             --path=/tmp/wordpress             --dbname=wordpress             --dbuser=root             --dbpass=root             --dbhost=127.0.0.1:3306             --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp core install             --path=/tmp/wordpress             --url=http://atora-theme.test             --title="ATORA Theme CI"             --admin_user=admin             --admin_password=atora-theme-ci-password             --admin_email=ci@example.test             --skip-email

      - name: Install and activate ATORA Theme
        shell: bash
        run: |
          mkdir -p /tmp/wordpress/wp-content/themes/atora-theme
          rsync -a --exclude=.git ./ /tmp/wordpress/wp-content/themes/atora-theme/
          wp theme activate atora-theme --path=/tmp/wordpress
          wp theme status atora-theme --path=/tmp/wordpress
          wp eval '
            $theme = wp_get_theme();
            if ( "Atora Theme" !== $theme->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme\n" );
              exit( 1 );
            }
          ' --path=/tmp/wordpress

      - name: Surface WordPress debug log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            sed -n '1,400p' /tmp/wordpress/wp-content/debug.log
          fi
