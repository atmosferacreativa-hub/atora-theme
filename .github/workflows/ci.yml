name: Atora Meridian CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atora-theme-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "7.4"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP files
        shell: bash
        run: |
          find . -path ./.git -prune -o -name '*.php' -print0 |
            xargs -0 -n1 php -l

  static-checks:
    name: Version and links
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: "Check version: style.css vs ATORA_THEME_VERSION"
        shell: bash
        run: bash scripts/check-version.sh

      - name: "Validate tel: and WhatsApp links"
        shell: bash
        run: bash scripts/validate-links.sh

  distribution-zip:
    name: Distribution ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Build ZIP
        shell: bash
        run: bash scripts/build-dist.sh HEAD

      - name: Inspect ZIP
        shell: bash
        run: |
          zip_path="$(ls dist/atora-meridian-*.zip)"
          listing="$(unzip -Z1 "$zip_path")"
          failures=0
          for required in style.css functions.php theme.json screenshot.png; do
            if ! grep -qx "atora-theme/${required}" <<< "$listing"; then
              echo "Falta atora-theme/${required}" >&2; failures=$((failures + 1))
            fi
          done
          if grep -qvE '^atora-theme/' <<< "$listing"; then
            echo "Hay entradas fuera de la carpeta raíz atora-theme/" >&2; failures=$((failures + 1))
          fi
          for forbidden in .github scripts .git dist; do
            if grep -qE "^atora-theme/${forbidden}/" <<< "$listing"; then
              echo "No debe incluir ${forbidden}/" >&2; failures=$((failures + 1))
            fi
          done
          for forbidden in README.md CHANGELOG.md .distignore .gitignore; do
            if grep -qx "atora-theme/${forbidden}" <<< "$listing"; then
              echo "No debe incluir ${forbidden}" >&2; failures=$((failures + 1))
            fi
          done
          echo "$zip_path: $(wc -l <<< "$listing") entradas"
          exit $failures

  wordpress-smoke:
    name: WordPress ${{ matrix.wordpress }} / PHP 8.1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "6.4"
          - "6.8"

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out theme
        uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        shell: bash
        run: |
          wp core download --version="${{ matrix.wordpress }}" --skip-content --path=/tmp/wordpress
          wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/wordpress
          wp config set WP_DEBUG_DISPLAY false --raw --path=/tmp/wordpress
          wp core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title="Atora Meridian CI" --admin_user=admin --admin_password=atora-theme-ci-password --admin_email=ci@example.test --skip-email
          wp rewrite structure '/%postname%/' --path=/tmp/wordpress

      - name: Install and activate Atora Meridian
        shell: bash
        run: |
          mkdir -p /tmp/wordpress/wp-content/themes/atora-theme
          rsync -a --exclude=.git --exclude=.github --exclude=dist ./ /tmp/wordpress/wp-content/themes/atora-theme/
          wp theme activate atora-theme --path=/tmp/wordpress
          wp eval '
            $theme = wp_get_theme();
            if ( "Atora Meridian" !== $theme->get( "Name" ) ) {
              fwrite( STDERR, "Unexpected active theme: " . $theme->get( "Name" ) . "\n" );
              exit( 1 );
            }
          ' --path=/tmp/wordpress
          wp post create --post_type=page --post_status=publish --post_title="Pagina CI" --path=/tmp/wordpress
          wp post create --post_type=post --post_status=publish --post_title="Entrada CI" --path=/tmp/wordpress

      - name: Render front-end pages
        shell: bash
        run: |
          wp server --host=127.0.0.1 --port=8080 --path=/tmp/wordpress > /tmp/wp-server.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          failures=0
          for path in / /pagina-ci/ /entrada-ci/ "/?s=ci" /no-existe/; do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:8080${path}")
            expected=200
            [[ "$path" == /no-existe/ ]] && expected=404
            if [[ "$code" != "$expected" ]] || grep -qiE 'Fatal error|Parse error|critical error' /tmp/page.html; then
              echo "FAIL ${path}: HTTP ${code} (esperado ${expected})" >&2
              failures=$((failures + 1))
            else
              echo "OK ${path}: HTTP ${code}"
            fi
          done
          if [[ -f /tmp/wordpress/wp-content/debug.log ]] && grep -E 'PHP (Fatal|Parse|Warning)' /tmp/wordpress/wp-content/debug.log | grep -q 'themes/atora-theme'; then
            echo "Errores PHP del tema en debug.log" >&2
            failures=$((failures + 1))
          fi
          exit $failures

      - name: Surface WordPress debug log
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/wordpress/wp-content/debug.log ]]; then
            sed -n '1,400p' /tmp/wordpress/wp-content/debug.log
          fi
